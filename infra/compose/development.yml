name: discorda-dev
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: discorda
      POSTGRES_USER: discorda_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discorda_dev -d discorda"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
